<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <main class="page">
    <form class="glass-card" action="#" method="post">

      <header class="form-header">
        <h1>Get in touch</h1>
        <p>Fill out the form below and I will get back to you soon.</p>
      </header>

      <div class="row">
        <div class="field">
          <label for="first-name">First name</label>
          <input type="text" id="first-name" name="first_name" placeholder="John" required>
        </div>

        <div class="field">
          <label for="last-name">Last name</label>
          <input type="text" id="last-name" name="last_name" placeholder="Smith" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required>
      </div>

      <div class="field">
        <label for="phone">Phone <span class="optional">(optional)</span></label>
        <input type="tel" id="phone" name="phone" placeholder="+1 555 123 4567">
      </div>

      <div class="field">
        <label for="subject">Subject</label>
        <select id="subject" name="subject" required>
          <option value="" disabled selected>Select a subject</option>
          <option value="general">General inquiry</option>
          <option value="job">Job opportunity</option>
          <option value="project">Project collaboration</option>
          <option value="feedback">Feedback</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
      </div>

      <label class="checkbox">
        <input type="checkbox" name="agree" required>
        <span>I agree to be contacted about my message.</span>
      </label>

      <button type="submit" class="btn">Send message</button>

    </form>
  </main>

</body>
</html>
